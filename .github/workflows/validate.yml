name: Validate RedBeast
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: RedBeast/frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -c RedBeast/backend/requirements.lock -r RedBeast/backend/requirements-dev.txt
      - name: Python tests (offline fixtures)
        working-directory: RedBeast/backend
        run: python -m pytest -q
      - name: Install frontend dependencies
        run: npm ci --prefix RedBeast/frontend
      - name: Frontend tests and production build
        working-directory: RedBeast/frontend
        run: |
          npm test
          npm run build
          npm run lint
      - name: Verify public prepared observations
        run: python RedBeast/docker/verify_seed.py RedBeast/seed-data
      - name: Retain built application
        uses: actions/upload-artifact@v4
        with:
          name: redbeast-frontend
          path: RedBeast/frontend/dist
